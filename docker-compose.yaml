
version: "3"

services:
  node-app:
    image: mohamedsaber21/express-node-app-docker:latest
    env_file:
      - ./.env
    deploy:
      replicas: 4
      update_config:
        parallelism: 2
        delay: 10s
      restart_policy:
        condition: on-failure
        delay: 5s

  mongo:
    image: mongo:latest
    volumes:
      - mongo-db:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    deploy:
      restart_policy:
        condition: any

  redis:
    image: redis:latest
    deploy:
      restart_policy:
        condition: any

  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    deploy:
      restart_policy:
        condition: any

volumes:
  mongo-db:
